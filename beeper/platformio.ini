[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

# Required libraries for audio playback with MAX98357A
lib_deps =
    schreibfaul1/ESP32-audioI2S@^2.7.0

# Compiler flags
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
